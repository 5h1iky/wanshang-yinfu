# 工程级 Gradle 配置（跨机器通用，勿写本机路径）
#
# ⚠️ 这里**不要**写 org.gradle.java.home —— 曾经写死 E:/Android studio/jbr，
#    导致别人 clone 后无法编译（2026-09-30 修复）。
#    需要指定 JDK 的人，写在自己的**用户级**配置里：
#      Windows: %GRADLE_USER_HOME%\gradle.properties
#      macOS/Linux: ~/.gradle/gradle.properties
#    本机（开发机）的 JDK 21 就配在 D:\gradle-cache\gradle.properties。
#    构建要求：JDK 17+（本项目用 21）+ Android SDK 36。

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
