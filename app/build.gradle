plugins {
    id 'com.android.application'
}

// 发布签名：读本地 keystore.properties（不入库，.gitignore 已挡；缺失时 release 退化为未签名）
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// dywatch 手表端客户端 · 应用名「腕上音符」（用户命名，2026-09-25）
// 依赖纪律（决策 #12）：新增依赖先实测镜像存在再写版本
// 以下版本均取自 SAChat UPGRADE_PLAN §7.3 实测清单（阿里云镜像可达）
android {
    namespace 'com.dywatch.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dywatch.app'
        minSdk 21
        targetSdk 36
        versionCode 17
        versionName '0.9.3'
    }

    // ---- 0.9.0 起同版本两个构建（用户 2026-10-25 拍板）----
    //   webview ：不引 GeckoView，用系统 WebView（体积 6.27MB，行为与 0.8.x 一致）
    //   kernel  ：内置 GeckoView（v7a），一个 App、不装第二个 APK；体积 ≈60MB
    // 两个变体**同包名同签名**：用户装哪个都能覆盖升级、登录态不掉；同时只能装一个。
    flavorDimensions 'engine'
    productFlavors {
        webview {
            dimension 'engine'
        }
        kernel {
            dimension 'engine'
            // GeckoView 只有 armeabi-v7a 构件（32 位仍可用，arm64 机器会以 32 位进程运行）
            ndk { abiFilters 'armeabi-v7a' }
        }
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }

        // ⚠️ 仅供**真机验证**的构建，不发布、不参与 Release、不进 releases/latest。
        //    release 同签名（可覆盖安装 → 登录态不掉）+ debuggable（可用 run-as 读写
        //    /data/data/com.dywatch.app/shared_prefs → 在不 pm clear 的前提下模拟"全新安装"、
        //    注入公告缓存），专门解决"验证要清数据、清数据又掉登录"的死结。
        //    打包： gradlew :app:assembleDevdiag
        devdiag {
            initWith(buildTypes.release)
            debuggable true
            // 子模块（dkplayer-*）只有 debug/release 两个变体 → 让它们回退到 release
            matchingFallbacks = ['release']
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // KernelSeam 要用 BuildConfig.FLAVOR 判断当前是不是「装了内核」的构建（AGP 8 默认关掉了 BuildConfig）
    buildFeatures {
        buildConfig true
    }

    testOptions {
        // 联网冒烟测试（FeedFetchTest）按需开启：gradlew test -Dnetwork.test=true
        unitTests.all {
            systemProperty 'network.test', System.getProperty('network.test', 'false')
        }
    }
}

// ---- 发布卫生闸门（2026-10-02，代码审计 H2 + 发布流程）----
//
// 背景：Release 页历史上**同时挂着 debug 包**（字母序还排在前面），而 debug 包与 release 包
// 签名不同 —— 用户点错装成 debug 包后，照着公告说的"覆盖安装即可"操作必然失败，
// 只能卸载重装、登录态一起没。更糟的是 devdiag（release 同签名 + debuggable）万一误发，
// 任何能碰到设备的人 `adb shell run-as` 就能读出会话 cookie。
//
// 两道闸门：
//  ① devdiag 的产物文件名自带 DO-NOT-PUBLISH —— 它永远不可能和 release 资产名混淆；
//  ② assembleRelease 结束时校验**合并后的清单**里没有 debuggable=true：
//     一旦有人把它抄进 release（或改了 buildType 继承），构建当场失败，而不是等用户装上才发现。
androidComponents {
    onVariants(selector().withBuildType("devdiag")) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("wanshang-yinfu-DEVDIAG-DO-NOT-PUBLISH.apk")
        }
    }
    // 发布产物名带 flavor：wanshang-yinfu-v0.9.0-webview-release.apk / -kernel-release.apk
    // （0.9.0 起同版本两个构建，文件名必须能区分，否则发版时必然混淆）
    onVariants(selector().withBuildType("release")) { variant ->
        // AGP 8.7 的 ApplicationVariant 没有 versionName 属性（实测 MissingPropertyException），
        // 直接从 defaultConfig 取（我们在文件顶部就是字面量赋值的）
        def vn = android.defaultConfig.versionName
        variant.outputs.each { output ->
            output.outputFileName.set("wanshang-yinfu-v${vn}-${variant.flavorName}-release.apk")
        }
    }
}

// 闸门本体：校验**每个 release 变体**的合并清单里都没有 debuggable=true。
// ⚠️ 0.9.0 起有了 webview/kernel 两个 flavor，合并清单路径变成
//    intermediates/merged_manifest/<flavor><BuildType>/process<...>MainManifest/，
//    原先写死的 release 路径会扫不到 —— 这里改成扫目录，别让它静默失效。
def verifyReleaseNotDebuggable = {
    def root = file("${buildDir}/intermediates/merged_manifest")
    if (!root.exists()) {
        println "发布闸门：找不到 merged_manifest 目录，跳过 debuggable 校验"
        return
    }
    def checked = 0
    root.listFiles()?.each { dir ->
        // 只校验 release 变体（devdiag 本身就是 debuggable，不该在这里被拦）
        if (!(dir.name == 'release' || dir.name.endsWith('Release'))) return
        dir.eachFileRecurse { f ->
            if (f.name != 'AndroidManifest.xml') return
            checked++
            if (f.getText('UTF-8').contains('android:debuggable="true"')) {
                throw new GradleException(
                        "release 包被标记为 debuggable，禁止发布（代码审计 H2）：${f}")
            }
        }
    }
    println "发布闸门：已校验 ${checked} 个 release 合并清单，均未标记 debuggable ✓"
}

// ⚠️ 2026-10-02 记录一次**误判**，免得后人重踩：我起初用
//     tasks.matching { it.name == 'assembleRelease' }.configureEach { doLast { … } }
//   构建后按 "发布闸门" 去 grep 输出，没匹配到，就认定"闸门没执行"，改成了下面这套双保险。
//   后来把完整输出落盘才发现：闸门一直有执行，只是 Windows 控制台的编码把中文打成了乱码
//   （����բ��），是**我的 grep 没匹配上**，不是 Gradle 没跑。
//   双保险保留（whenTaskAdded 管以后注册的任务、matching().all 管已存在的），
//   但结论要写对：这不是"修了一个不生效的守卫"，而是"差点因为乱码冤枉了它"。
def releaseGateAttached = { t ->
    // 0.9.0 起有 flavor：assembleRelease + assembleWebviewRelease + assembleKernelRelease 都要挂
    if (!(t.name == 'assembleRelease'
            || (t.name.startsWith('assemble') && t.name.endsWith('Release')))) return
    if (t.ext.has('dywatchReleaseGate')) return
    t.ext.dywatchReleaseGate = true
    t.doLast(verifyReleaseNotDebuggable)
}

tasks.whenTaskAdded { releaseGateAttached(it) }
tasks.matching {
    it.name == 'assembleRelease'
            || (it.name.startsWith('assemble') && it.name.endsWith('Release'))
}.all { releaseGateAttached(it) }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    // 列表三件套（评论/会话/聊天）迁移 RecyclerView；1.3.2 为稳定版，
    // 坐标经阿里云 google 仓库实测存在（2026-09-26，纪律：新增依赖先测镜像再写版本）
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // DKVideoPlayer（源码内嵌，Apache-2.0）：M2 刷视频页
    implementation project(':dkplayer-java')
    implementation project(':dkplayer-ui')
    implementation project(':dkplayer-videocache')

    // 图片加载（封面图）：Glide 4.16.0（版本实测存在；⚠️ group 是 com.github.bumptech.glide——
    // SAChat 清单误写 com.bumptech.glide，实测 404，勿再抄错）
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // a_bogus 签名：App 内嵌 Rhino 跑 ylcangel/douyin_sign 的 JS（Apache-2.0）
    // 坐标与版本实测阿里云 central 200（2026-09-25）
    implementation 'org.mozilla:rhino:1.7.15'
    // HTTP 客户端（Feed/IM 数据层）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // JSON 解析（纯 Java 可单测；坐标实测 200）
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'

    // ---- 内核构建专用（kernel flavor）：GeckoView 100 / armeabi-v7a ----
    // 为什么是 100 而不是最新：07 调研实测 32 位构件线连续无缺档，100 的体积与内存最省；
    // 152+ 的 AAR 元数据把 minCompileSdk 抬到 37，当前工具链（AGP 8.7 / compileSdk 36）编不过。
    // 体积代价：APK 从 6.27MB → ≈60MB（so 43MB + omni.ja 8.35MB），只影响 kernel 变体。
    kernelImplementation 'org.mozilla.geckoview:geckoview-armeabi-v7a:100.0.20220519220738'
}

// ---- kernel 变体的内核扩展（2026-10-25）----
// 为什么要在构建期生成：GeckoView 只认 `ensureBuiltIn("resource://android/assets/<dir>/")` 这种
// **内置扩展**（免签名，探针工程实测跑通）；未签名 XPI 走 install() 会被拒或永久挂起。
// 而扩展里那份 chat_bridge.js 必须与 WebView 线**同一份**（P0-1 的判据修复只有一处真源），
// 所以这里把 assets/chat_bridge.js 拷进构建产物，而不是在仓库里放两个副本。
def kernelExtAssets = layout.buildDirectory.dir('generated/kernelAssets')

def syncKernelExt = tasks.register('syncKernelExt', Copy) {
    from(layout.projectDirectory.dir('kernel-ext')) {
        into 'kext'
    }
    from(layout.projectDirectory.file('src/main/assets/chat_bridge.js')) {
        into 'kext'
    }
    into(kernelExtAssets)
}

// ⚠️ 必须用 .get().asFile 这种**立即求值**的写法：直接传 Provider 给 srcDir 时，
//    AGP 不会把它算进 kernel 变体的 assets（实测：APK 里没有 assets/kext/*，
//    而 ensureBuiltIn 找不到 manifest 只会静默失败，表现为"扩展一直装不上"）。
android.sourceSets.kernel.assets.srcDir(kernelExtAssets.get().asFile)
// Gradle 的严格校验：任何读这个生成目录的 kernel 任务都要声明关系，否则报
// "uses this output ... without declaring an explicit or implicit dependency"。
// 用 mustRunAfter 而不是 dependsOn，避免和 Copy 任务形成环。
tasks.configureEach { t ->
    if (t.name.contains('Kernel') && t.name != 'syncKernelExt') {
        t.mustRunAfter(syncKernelExt)
        if (t.name.startsWith('mergeKernel') && t.name.endsWith('Assets')) {
            t.dependsOn(syncKernelExt)
        }
    }
}
